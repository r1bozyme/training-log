<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature-Check</title>
<style>
  body { font: 600 17px/1.6 system-ui, sans-serif; padding: 32px 24px; margin: 0; }
  h1 { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; font-weight: 700; margin: 0 0 24px; }
  #verdict { font-size: 26px; margin-bottom: 28px; line-height: 1.3; }
  #detail { white-space: pre; font: 500 14px/1.9 ui-monospace, Menlo, monospace; color: #444; border-top: 1px solid #ddd; padding-top: 20px; }
  button { margin-top: 28px; padding: 14px 22px; font: 700 14px system-ui; border: none; border-radius: 10px; background: #222; color: #fff; }
  #perm { margin-top: 14px; font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1>Notification Triggers</h1>
<div id="verdict">…</div>
<div id="detail"></div>
<button id="ask">Notification-Permission anfragen</button>
<div id="perm"></div>

<script>
(function () {
  var hasNotif = (typeof Notification !== "undefined");
  var hasTrigger = hasNotif && ("showTrigger" in Notification.prototype);

  document.getElementById("verdict").textContent =
    hasTrigger ? "✅ VERFÜGBAR" : "❌ NICHT VERFÜGBAR";

  document.getElementById("detail").textContent = [
    "showTrigger      " + hasTrigger,
    "Notification     " + (hasNotif ? "vorhanden" : "fehlt"),
    "Permission       " + (hasNotif ? Notification.permission : "–"),
    "ServiceWorker    " + ("serviceWorker" in navigator),
    "PushManager      " + ("PushManager" in window),
    "periodicSync     " + ("periodicSync" in (window.ServiceWorkerRegistration || {}).prototype ? true : false),
    "standalone       " + (window.matchMedia("(display-mode: standalone)").matches),
    "",
    navigator.userAgent
  ].join("\n");

  document.getElementById("ask").onclick = function () {
    if (!hasNotif) { document.getElementById("perm").textContent = "Notification-API fehlt."; return; }
    Notification.requestPermission().then(function (p) {
      document.getElementById("perm").textContent = "Permission: " + p;
    });
  };
})();
</script>
</body>
</html>
