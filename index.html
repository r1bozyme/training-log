<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#F5F5F3">
<title>Training Log · Thomas</title>
<link rel="apple-touch-icon" id="apple-icon" href="">
<link rel="icon" id="favicon" href="">
<script>
  (function(){
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");
    // Runder Hintergrund – Ecken bleiben transparent
    ctx.beginPath();
    ctx.arc(256, 256, 254, 0, Math.PI * 2);
    ctx.fillStyle = "#1A1A1A";
    ctx.fill();
    ctx.font = "280px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("💪", 256, 278);
    const url = c.toDataURL("image/png");
    document.getElementById("apple-icon").href = url;
    document.getElementById("favicon").href = url;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #F5F5F3; --surface: #FFFFFF; --border: #E8E8E8;
  --text: #1A1A1A; --muted: #999; --dim: #CCCCCC;
  --push: #6B7A00; --push-bg: #F4F8CC; --push-bd: #BFCC00;
  --pull: #0077AA; --pull-bg: #E0F2FF; --pull-bd: #80C8EE;
  --legs: #C04015; --legs-bg: #FFE8E0; --legs-bd: #FF9977;
  --neutral: #1A1A1A; --go: #2A7A2A; --go-bg: #E8F4E8;
  --fd: 'Bebas Neue', sans-serif; --fb: 'Figtree', sans-serif;
  --sb: env(safe-area-inset-bottom, 0px);
}
html, body { background: var(--bg); color: var(--text); font-family: var(--fb); min-height: 100vh; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(72px + var(--sb)); }

.hdr { padding: 52px 20px 0; display: flex; justify-content: space-between; align-items: flex-end; }
.hdr-title { font-family: var(--fd); font-size: 36px; letter-spacing: 3px; line-height: 1; color: var(--text); }
.hdr-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }

.bnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; padding: 8px 8px calc(8px + var(--sb)); gap: 3px; z-index: 100;
}
.nbtn { flex: 1; padding: 11px 0; border-radius: 10px; border: none; cursor: pointer; font-family: var(--fb); font-weight: 700; font-size: 11px; letter-spacing: -0.2px; transition: all .15s; background: transparent; color: var(--muted); }
.nbtn.active { background: var(--neutral); color: #FFFFFF; }

.view { display: none; } .view.active { display: block; }

.sec { padding: 20px 20px 0; }
.fl { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
.er { display: flex; gap: 8px; margin-bottom: 16px; }
.eb { flex: 1; padding: 14px 0; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--muted); font-family: var(--fd); font-size: 20px; letter-spacing: 1px; cursor: pointer; transition: all .15s; }
.eb[data-e="Push"].active { border-color: var(--push-bd); color: var(--push); background: var(--push-bg); }
.eb[data-e="Pull"].active { border-color: var(--pull-bd); color: var(--pull); background: var(--pull-bg); }
.eb[data-e="Legs"].active { border-color: var(--legs-bd); color: var(--legs); background: var(--legs-bg); }
input[type="date"], input[type="number"], input[type="text"], select {
  width: 100%; padding: 14px 16px; background: var(--surface); border: 2px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--fb); font-size: 15px;
  margin-bottom: 16px; appearance: none; -webkit-appearance: none; outline: none; transition: border-color .15s;
}
input:focus, select:focus { border-color: #AAAAAA; }
input::placeholder { color: var(--dim); }
input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
.sr { display: flex; gap: 8px; margin-bottom: 16px; }
.sc { flex: 1; }
.sc label { display: block; font-size: 10px; color: var(--dim); text-align: center; margin-bottom: 4px; font-weight: 600; letter-spacing: 1px; }
.sc input { text-align: center; margin-bottom: 0; padding: 14px 4px; }

/* HINT */
.hint { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: none; border: 1px solid; transition: background .2s, border-color .2s; }
.hint.show { display: block; }
.hint.Push { background: var(--push-bg); border-color: var(--push-bd); }
.hint.Pull { background: var(--pull-bg); border-color: var(--pull-bd); }
.hint.Legs { background: var(--legs-bg); border-color: var(--legs-bd); }
.hint-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.hint-ziel { font-size: 13px; font-weight: 700; }
.hint.Push .hint-ziel { color: var(--push); }
.hint.Pull .hint-ziel { color: var(--pull); }
.hint.Legs .hint-ziel { color: var(--legs); }
.hint-muskel { font-size: 11px; color: var(--muted); text-align: right; max-width: 120px; }
.hint-reps { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
.hint.Push .hint-reps { background: #D8E84020; color: var(--push); }
.hint.Pull .hint-reps { background: #0077AA20; color: var(--pull); }
.hint.Legs .hint-reps { background: #C0401520; color: var(--legs); }
.hint-tipp { font-size: 12px; color: #777; line-height: 1.4; }

/* LAST ENTRY */
.last-entry { display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
.last-entry.show { display: flex; align-items: center; gap: 10px; }
.last-icon { font-size: 16px; flex-shrink: 0; }
.last-lbl { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.last-data { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 2px; }
.last-up { background: #E8F4E8; color: var(--go); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-left: 4px; white-space: nowrap; }

/* TIMER */
.timer-wrap { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; transition: border-color .3s; }
.timer-wrap.running { border-color: var(--neutral); }
.timer-wrap.done { border-color: var(--go); background: var(--go-bg); }
.timer-lbl { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
.timer-disp { font-family: var(--fd); font-size: 36px; letter-spacing: 2px; color: var(--text); line-height: 1; transition: color .3s; }
.timer-wrap.running .timer-disp { color: var(--neutral); }
.timer-wrap.done .timer-disp { color: var(--go); font-size: 22px; }
.timer-hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
.timer-btn { padding: 12px 18px; border-radius: 10px; border: none; font-family: var(--fd); font-size: 17px; letter-spacing: 1px; cursor: pointer; transition: all .15s; background: var(--neutral); color: #FFFFFF; flex-shrink: 0; }
.timer-btn.running { background: #CC2200; }
.timer-btn.done { background: var(--go); }

/* TOGGLE */
.trow { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; cursor: pointer; user-select: none; }
.trow.on { border-color: var(--neutral); }
.tlbl { font-size: 14px; font-weight: 500; color: var(--muted); }
.tsw { width: 46px; height: 26px; border-radius: 13px; background: var(--dim); position: relative; transition: background .2s; flex-shrink: 0; }
.trow.on .tsw { background: var(--neutral); }
.tkn { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFF; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.trow.on .tkn { left: 23px; }

.sbtn { width: 100%; padding: 18px; background: var(--neutral); border: none; border-radius: 12px; font-family: var(--fd); font-size: 22px; letter-spacing: 3px; color: #FFFFFF; cursor: pointer; transition: opacity .15s, transform .1s; margin-bottom: 8px; }
.sbtn:active { opacity: 0.85; transform: scale(0.98); }

.flash { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--neutral); color: #FFFFFF; padding: 10px 28px; border-radius: 24px; font-weight: 700; font-size: 14px; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.flash.show { opacity: 1; }

.sbar { display: flex; gap: 8px; padding: 16px 20px 0; }
.sc2 { flex: 1; background: var(--surface); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid var(--border); }
.sc2.clickable { cursor: pointer; transition: all .15s; }
.sc2.clickable.active { border-color: var(--go); background: var(--go-bg); }
.sc2.clickable.active .snum { color: var(--go); }
.snum { font-family: var(--fd); font-size: 28px; color: var(--neutral); letter-spacing: 1px; }
.slbl { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

.frow { display: flex; gap: 8px; padding: 16px 20px 0; overflow-x: auto; scrollbar-width: none; }
.frow::-webkit-scrollbar { display: none; }
.fbtn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-family: var(--fb); font-weight: 600; font-size: 13px; background: var(--surface); color: var(--muted); white-space: nowrap; flex-shrink: 0; transition: all .15s; }
.fbtn.active { background: var(--neutral); color: #FFFFFF; border-color: var(--neutral); }

.dg { padding: 16px 20px 0; }
.dl2 { font-family: var(--fd); font-size: 13px; letter-spacing: 2px; color: var(--dim); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.ec { background: var(--surface); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; animation: fi .2s ease; border: 1px solid var(--border); }
@keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.ebdg { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
.badge-Push { background: var(--push-bg); color: var(--push); }
.badge-Pull { background: var(--pull-bg); color: var(--pull); }
.badge-Legs { background: var(--legs-bg); color: var(--legs); }
.ei { flex: 1; min-width: 0; }
.en { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.em { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ubdg { background: #E8F4E8; color: #2A7A2A; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; flex-shrink: 0; }
.dbtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 20px; padding: 0 2px; flex-shrink: 0; line-height: 1; transition: color .15s; }
.dbtn.confirm { color: #CC0000; }

.xbtn { margin: 16px 20px; width: calc(100% - 40px); padding: 14px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; font-family: var(--fb); font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s; display: block; }
.xbtn:hover { border-color: #AAAAAA; color: var(--text); }

.empty { text-align: center; padding: 60px 20px; color: var(--dim); }
.ei2 { font-size: 48px; margin-bottom: 16px; }

/* PLAN */
.peinheit { padding: 20px 20px 0; }
.peh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pel { font-family: var(--fd); font-size: 22px; letter-spacing: 2px; }
.pel.Push { color: var(--push); } .pel.Pull { color: var(--pull); } .pel.Legs { color: var(--legs); }
.pline { flex: 1; height: 1px; background: var(--border); }
.pcard { background: var(--surface); border-radius: 10px; margin-bottom: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
.pch { display: flex; align-items: center; padding: 13px 14px; gap: 12px; }
.pcn { font-weight: 700; font-size: 14px; flex: 1; color: var(--text); }
.pcm { font-size: 12px; color: var(--muted); }
.pcc { color: var(--dim); font-size: 12px; transition: transform .2s; flex-shrink: 0; }
.pcard.open .pcc { transform: rotate(180deg); }
.pcb { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.pcard.open .pcb { display: block; }
.pmuscle { font-size: 11px; color: var(--muted); margin-top: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.prow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ppill { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.pill-a { background: #F0F0F0; color: #888; }
.pill-z { background: #EAEAEA; color: var(--neutral); }
.ppause { background: #F0F0F0; color: #666; }
.psteps { margin-top: 10px; padding-left: 0; list-style: none; }
.psteps li { font-size: 13px; color: #666; line-height: 1.5; padding: 3px 0 3px 16px; position: relative; }
.psteps li::before { content: "→"; position: absolute; left: 0; color: var(--dim); font-size: 11px; top: 5px; }
.ptipp { margin-top: 10px; padding: 8px 10px; background: #F8F8F8; border-left: 2px solid var(--neutral); border-radius: 0 6px 6px 0; font-size: 12px; color: #666; line-height: 1.4; }
.ptipp strong { color: var(--neutral); }
.pnote { margin: 16px 20px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.pver { text-align: center; font-size: 11px; color: var(--dim); padding: 8px 20px 4px; }

/* STATS */
.stcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.stc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.stc-name { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stc-delta { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
.stc-delta.up { background: var(--go-bg); color: var(--go); }
.stc-delta.down { background: #FFE8E0; color: #CC2200; }
.stc-delta.flat { background: #F0F0F0; color: var(--muted); }
.spark { width: 100%; height: 44px; display: block; }
.spark-none { font-size: 12px; color: var(--dim); padding: 12px 0; text-align: center; }
.stc-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.stc-meta strong { color: var(--text); }

/* GEWICHT */
.wbar { display: flex; gap: 8px; padding: 24px 20px 0; }
.wkpi { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center; }
.wkpi-num { font-family: var(--fd); font-size: 26px; letter-spacing: 1px; line-height: 1.1; color: var(--neutral); }
.wkpi-num.up { color: var(--go); }
.wkpi-num.fast { color: var(--legs); }
.wkpi-num.slow { color: var(--muted); }
.wkpi-lbl { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; }
.wverdict { margin: 8px 20px 0; padding: 10px 14px; border-radius: 10px; font-size: 12px; line-height: 1.45; border: 1px solid; }
.wverdict.ok   { background: var(--go-bg);  border-color: #B8DCB8; color: #2A5A2A; }
.wverdict.fast { background: var(--legs-bg); border-color: var(--legs-bd); color: #8A2E10; }
.wverdict.slow { background: #F0F0F0; border-color: var(--border); color: #666; }
.wverdict strong { font-weight: 700; }
.wchart { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 16px 20px 0; padding: 14px 12px 10px; }
.wchart-hd { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 10px; }
.wchart-t { font-family: var(--fd); font-size: 15px; letter-spacing: 2px; color: var(--muted); }
.wlegend { display: flex; gap: 12px; font-size: 10px; color: var(--muted); font-weight: 600; }
.wlegend span { display: flex; align-items: center; gap: 4px; }
.wdot { width: 14px; height: 2.5px; border-radius: 2px; display: inline-block; }
.wsvg { width: 100%; height: auto; display: block; }
.wrange { display: flex; gap: 6px; padding: 12px 20px 0; }
.wrbtn { flex: 1; padding: 8px 0; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: var(--fb); font-weight: 600; font-size: 12px; cursor: pointer; transition: all .15s; }
.wrbtn.active { background: var(--neutral); color: #FFFFFF; border-color: var(--neutral); }
.wlist { padding: 16px 20px 0; }
.wrow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin-bottom: 6px; }
.wrow-d { font-size: 13px; color: var(--muted); width: 78px; flex-shrink: 0; font-weight: 600; }
.wrow-kg { font-size: 15px; font-weight: 700; flex: 1; }
.wrow-tr { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.wnote { margin: 16px 20px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <div>
      <div class="hdr-title">TRAINING LOG</div>
      <div class="hdr-sub" id="hdr-date"></div>
    </div>
    <div style="font-size:28px">💪</div>
  </div>

  <!-- EINTRAG -->
  <div id="view-add" class="view active">
    <div class="sec" style="padding-top:24px">
      <label class="fl">Datum</label>
      <input type="date" id="f-date">

      <label class="fl">Einheit</label>
      <div class="er">
        <button class="eb active" data-e="Push" onclick="selEinheit('Push')">PUSH</button>
        <button class="eb" data-e="Pull" onclick="selEinheit('Pull')">PULL</button>
        <button class="eb" data-e="Legs" onclick="selEinheit('Legs')">LEGS</button>
      </div>

      <label class="fl">Übung</label>
      <select id="f-uebung" onchange="onUebungChange()"></select>

      <div class="hint" id="hint">
        <div class="hint-top">
          <div>
            <div class="hint-ziel" id="h-ziel"></div>
            <span class="hint-reps" id="h-reps"></span>
          </div>
          <div class="hint-muskel" id="h-muskel"></div>
        </div>
        <div class="hint-tipp" id="h-tipp"></div>
      </div>

      <div class="last-entry" id="last-entry">
        <div class="last-icon">🕐</div>
        <div>
          <div class="last-lbl">Letztes Training · <span id="last-date"></span></div>
          <div class="last-data" id="last-data"></div>
        </div>
      </div>

      <label class="fl">Gewicht (kg)</label>
      <input type="number" id="f-gew" placeholder="z.B. 40" inputmode="decimal" step="0.5">

      <label class="fl">Wiederholungen pro Satz</label>
      <div class="sr">
        <div class="sc"><label>S1</label><input type="number" id="f-s1" placeholder="–" inputmode="numeric"></div>
        <div class="sc"><label>S2</label><input type="number" id="f-s2" placeholder="–" inputmode="numeric"></div>
        <div class="sc"><label>S3</label><input type="number" id="f-s3" placeholder="–" inputmode="numeric"></div>
        <div class="sc"><label>S4</label><input type="number" id="f-s4" placeholder="–" inputmode="numeric"></div>
      </div>

      <div class="timer-wrap" id="timer-wrap">
        <div>
          <div class="timer-lbl">Pause</div>
          <div class="timer-disp" id="timer-disp">–</div>
          <div class="timer-hint" id="timer-hint"></div>
        </div>
        <button class="timer-btn" id="timer-btn" onclick="toggleTimer()">▶ START</button>
      </div>

      <label class="fl">Notiz (optional)</label>
      <input type="text" id="f-not" placeholder="z.B. etwas schwer am Ende">

      <div class="trow" id="trow" onclick="toggleErhoehen()">
        <span class="tlbl">↑ Gewicht nächstes Mal erhöhen?</span>
        <div class="tsw"><div class="tkn"></div></div>
      </div>

      <button class="sbtn" onclick="saveEntry()">SPEICHERN</button>
    </div>
  </div>

  <!-- LOG -->
  <div id="view-log" class="view">
    <div class="sbar">
      <div class="sc2"><div class="snum" id="s-tot">0</div><div class="slbl">Einträge</div></div>
      <div class="sc2 clickable" id="card-up" onclick="setFilter('Erhöhen')"><div class="snum" id="s-up">0</div><div class="slbl">↑ Erhöhen</div></div>
      <div class="sc2"><div class="snum" id="s-days">0</div><div class="slbl">Einheiten</div></div>
    </div>
    <div class="frow">
      <button class="fbtn active" onclick="setFilter('Alle')">Alle</button>
      <button class="fbtn" onclick="setFilter('Push')">Push</button>

// Pausenzeiten pro Übungstyp
const PAUSE = {
  compound: { secs: 105, label: "90–120 Sek" },
  isolation: { secs: 75,  label: "60–90 Sek"  },
  core:      { secs: 52,  label: "45–60 Sek"  }
};

// ─── STATE ───────────────────────────────────────────
let curEinheit = "Push";
let erhoehen   = false;
let curFilter  = "Alle";
let pendingDel = null;
let timerIv    = null;
let timerLeft  = 0;
let timerTotal = 0;
let timerState = "idle"; // idle | running | done

// ─── INIT ────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("f-date").value = todayStr();
  document.getElementById("w-date").value = todayStr();
  document.getElementById("hdr-date").textContent =
    new Date().toLocaleDateString("de-DE", { weekday:"long", day:"numeric", month:"long" });
  document.getElementById("p-ver").textContent = PLAN.version;
  document.getElementById("p-verline").textContent = "Plan-Version: " + PLAN.version;
  fillUebung("Push");
  refreshHint();
  buildPlan();
  if (loadEntries().length > 0) showView("log");
});

// ─── STORAGE ─────────────────────────────────────────
function loadEntries() {
  try { return JSON.parse(localStorage.getItem("tl-e") || "[]"); } catch { return []; }
}
function saveEntries(arr) { localStorage.setItem("tl-e", JSON.stringify(arr)); }

// ─── FORM ────────────────────────────────────────────
function selEinheit(e) {
  curEinheit = e;
  document.querySelectorAll(".eb").forEach(b => b.classList.toggle("active", b.dataset.e === e));
  fillUebung(e);
  refreshHint();
}

function fillUebung(e) {
  document.getElementById("f-uebung").innerHTML =
    PLAN[e].map(x => `<option value="${x.name}">${x.name}</option>`).join("");
}

function onUebungChange() { refreshHint(); }

function refreshHint() {
  const name = document.getElementById("f-uebung").value;
  const ex   = PLAN[curEinheit].find(x => x.name === name);
  const hint = document.getElementById("hint");

  if (!ex) { hint.classList.remove("show"); return; }

  hint.className = "hint show " + curEinheit;
  document.getElementById("h-ziel").textContent   = "Ziel: " + ex.ziel;
  document.getElementById("h-reps").textContent   = ex.saetze + " Sätze · " + ex.repzone + " Wdh";
  document.getElementById("h-muskel").textContent = ex.muskel;
  document.getElementById("h-tipp").textContent   = ex.tipp;

  showLastEntry(name);
  setTimerDefaults(ex.typ || "isolation");
}

function showLastEntry(uebung) {
  const all = loadEntries();
  let last = null;
  for (let i = all.length - 1; i >= 0; i--) {
    if (all[i].uebung === uebung) { last = all[i]; break; }
  }
  const el = document.getElementById("last-entry");
  if (!last) { el.classList.remove("show"); return; }
  el.classList.add("show");
  const sets = [last.s1, last.s2, last.s3, last.s4].filter(Boolean).join(" / ");
  document.getElementById("last-date").textContent = fmtDate(last.date);
  const dataEl = document.getElementById("last-data");
  dataEl.textContent =
    (last.gewicht ? last.gewicht + " kg" : "") +
    (sets ? "  ·  " + sets + " Wdh" : "");
  if (last.erhoehen) {
    dataEl.innerHTML += ' <span class="last-up">↑ erhöhen!</span>';
  }
}

function setTimerDefaults(typ) {
  if (timerState !== "idle") return;
  const p = PAUSE[typ] || PAUSE.isolation;
  timerTotal = p.secs;
  timerLeft  = p.secs;
  document.getElementById("timer-disp").textContent = fmtTime(p.secs);
  document.getElementById("timer-hint").textContent = p.label;
}

function toggleErhoehen() {
  erhoehen = !erhoehen;
  document.getElementById("trow").classList.toggle("on", erhoehen);
}

function saveEntry() {
  const entry = {
    id:       Date.now(),
    date:     document.getElementById("f-date").value,
    einheit:  curEinheit,
    uebung:   document.getElementById("f-uebung").value,
    gewicht:  document.getElementById("f-gew").value,
    s1:       document.getElementById("f-s1").value,
    s2:       document.getElementById("f-s2").value,
    s3:       document.getElementById("f-s3").value,
    s4:       document.getElementById("f-s4").value,
    notiz:    document.getElementById("f-not").value,
    erhoehen: erhoehen
  };
  const arr = loadEntries();
  arr.push(entry);
  saveEntries(arr);

  ["f-gew","f-s1","f-s2","f-s3","f-s4","f-not"].forEach(id =>
    document.getElementById(id).value = "");
  erhoehen = false;
  document.getElementById("trow").classList.remove("on");

  showLastEntry(entry.uebung);
  showFlash("Gespeichert ✓");
}

// ─── TIMER ───────────────────────────────────────────
function startTimer() {
  const name = document.getElementById("f-uebung").value;
  const ex   = PLAN[curEinheit].find(x => x.name === name);
  const p    = PAUSE[(ex && ex.typ) || "isolation"] || PAUSE.isolation;
  timerTotal = p.secs;
  timerLeft  = p.secs;
  timerState = "running";
  renderTimer();
  clearInterval(timerIv);
  timerIv = setInterval(() => {
    timerLeft--;
    document.getElementById("timer-disp").textContent = fmtTime(timerLeft);
    if (timerLeft <= 0) {
      clearInterval(timerIv);
      timerState = "done";
      renderTimer();
      if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      showFlash("Pause vorbei – nächster Satz! 💪");
    }
  }, 1000);
}

function toggleTimer() {
  if (timerState === "idle") {
    startTimer();
  } else if (timerState === "running") {
    clearInterval(timerIv);
    timerState = "idle";
    renderTimer();
    refreshHint();
  } else {
    timerState = "idle";
    renderTimer();
    refreshHint();
  }
}

function renderTimer() {
  const wrap = document.getElementById("timer-wrap");
  const btn  = document.getElementById("timer-btn");
  const disp = document.getElementById("timer-disp");
  const hint = document.getElementById("timer-hint");
  wrap.className = "timer-wrap " + timerState;
  if (timerState === "idle") {
    btn.textContent  = "▶ START";
    btn.className    = "timer-btn";
  } else if (timerState === "running") {
    disp.textContent = fmtTime(timerLeft);
    btn.textContent  = "■ STOP";
    btn.className    = "timer-btn running";
  } else {
    disp.textContent = "FERTIG ✓";
    hint.textContent = "Nächster Satz!";
    btn.textContent  = "↺ NEU";
    btn.className    = "timer-btn done";
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return m > 0 ? m + ":" + r.toString().padStart(2, "0") : String(s);
}

// ─── LOG ─────────────────────────────────────────────
function setFilter(f) {
  curFilter = (f === "Erhöhen" && curFilter === "Erhöhen") ? "Alle" : f;
  document.querySelectorAll(".fbtn").forEach(b =>
    b.classList.toggle("active", b.textContent === curFilter));
  document.getElementById("card-up").classList.toggle("active", curFilter === "Erhöhen");
  renderLog();
}

function erhoehenList() {
  // Pro Übung den letzten Eintrag – nur wenn dieser als "erhöhen" markiert ist
  const latest = {};
  loadEntries().forEach(e => latest[e.uebung] = e);
  return Object.values(latest).filter(e => e.erhoehen);
}

function renderLog() {
  const all = loadEntries();
  let filtered;
  if (curFilter === "Erhöhen")   filtered = erhoehenList();
  else if (curFilter === "Alle") filtered = all;
  else                           filtered = all.filter(e => e.einheit === curFilter);
  const reversed = [...filtered].reverse();

  document.getElementById("s-tot").textContent  = all.length;
  document.getElementById("s-up").textContent   = erhoehenList().length;
  document.getElementById("s-days").textContent = new Set(all.map(e => e.date + e.einheit)).size;

  const cont = document.getElementById("entries");
  if (!reversed.length) {
    cont.innerHTML = curFilter === "Erhöhen"
      ? `<div class="empty"><div class="ei2">💪</div><div>Keine offenen Erhöhungen –<br>alles auf aktuellem Stand!</div></div>`
      : `<div class="empty"><div class="ei2">📋</div><div>Noch keine Einträge</div></div>`;
    return;
  }

  const groups = {};
  reversed.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));

  cont.innerHTML = Object.entries(groups).map(([date, es]) => {
    const [y, m, d] = date.split("-");
    const wd  = new Date(date).toLocaleDateString("de-DE", { weekday: "short" });
    const lbl = `${wd.toUpperCase()}, ${d}.${m}.${y}`;
    const cards = es.map(e => {
      const sets = [e.s1, e.s2, e.s3, e.s4].filter(Boolean).join(" / ");
      const meta = [
        e.gewicht ? e.gewicht + " kg" : null,
        sets      ? sets + " Wdh"     : null,
        e.notiz   || null
      ].filter(Boolean).join("  ·  ");
      const ip = pendingDel === e.id;
      return `<div class="ec">
        <span class="ebdg badge-${e.einheit}">${e.einheit.toUpperCase()}</span>
        <div class="ei">
          <div class="en">${e.uebung}</div>
          ${meta ? `<div class="em">${meta}</div>` : ""}
        </div>
        ${e.erhoehen ? '<span class="ubdg">↑</span>' : ""}
        <button class="dbtn ${ip ? "confirm" : ""}" onclick="handleDel(${e.id})">${ip ? "✓" : "×"}</button>
      </div>`;
    }).join("");
    return `<div class="dg"><div class="dl2">${lbl}</div>${cards}</div>`;
  }).join("");
}

function handleDel(id) {
  if (pendingDel === id) {
    saveEntries(loadEntries().filter(e => e.id !== id));
    pendingDel = null;
    renderLog();
  } else {
    pendingDel = id;
    renderLog();
    setTimeout(() => { if (pendingDel === id) { pendingDel = null; renderLog(); } }, 3000);
  }
}

// ─── PLAN ────────────────────────────────────────────
function buildPlan() {
  const cont = document.getElementById("plan-cont");
  cont.innerHTML = ["Push", "Pull", "Legs"].map(ein => {
    const exs = PLAN[ein].map((ex, i) => {
      const id    = `pc-${ein}-${i}`;
      const steps = ex.schritte.map(s => `<li>${s}</li>`).join("");
      const pause = PAUSE[ex.typ] || PAUSE.isolation;
      return `<div class="pcard" id="${id}" onclick="togCard('${id}')">
        <div class="pch">
          <div class="pcn">${ex.name}</div>
          <div class="pcm">${ex.saetze}×${ex.repzone}</div>
          <span class="pcc">▼</span>
        </div>
        <div class="pcb">
          <div class="pmuscle">${ex.muskel}</div>
          <div class="prow">
            <span class="ppill pill-a">${ex.aktuell}</span>
            <span class="ppill pill-z">→ ${ex.ziel}</span>
            <span class="ppill ppause">⏱ ${pause.label}</span>
          </div>
          <ul class="psteps">${steps}</ul>
          <div class="ptipp"><strong>Tipp:</strong> ${ex.tipp}</div>
        </div>
      </div>`;
    }).join("");
    return `<div class="peinheit">
      <div class="peh"><div class="pel ${ein}">${ein.toUpperCase()}</div><div class="pline"></div></div>
      ${exs}
    </div>`;
  }).join("");
}

function togCard(id) { document.getElementById(id).classList.toggle("open"); }

// ─── STATS ───────────────────────────────────────────
function parseKg(g) {
  const n = parseFloat(String(g || "").replace(",", "."));
  return isNaN(n) ? null : n;
}

function sparkline(vals, cssColor) {
  const w = 260, h = 44, pad = 4;
  const min = Math.min(...vals), max = Math.max(...vals);
  const rng = (max - min) || 1;
  const step = (w - 2 * pad) / Math.max(vals.length - 1, 1);
  const pts = vals.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / rng) * (h - 2 * pad);
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const lastPt = pts[pts.length - 1].split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}" fill="none" stroke="${cssColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3.5" fill="${cssColor}"/>
  </svg>`;
}

function fmtKg(n) {
  return (Number.isInteger(n) ? n : n.toFixed(1).replace(".", ",")) + " kg";
}

function buildStats() {
  const all  = loadEntries();
  const cont = document.getElementById("stats-cont");

  if (!all.length) {
    cont.innerHTML = `<div class="empty"><div class="ei2">📊</div><div>Noch keine Daten –<br>erst trainieren, dann Statistik!</div></div>`;
    return;
  }

  // ── Zusammenfassung ──
  const sessions   = new Set(all.map(e => e.date + e.einheit)).size;
  const now        = Date.now();
  const days30     = new Set(all.filter(e => now - new Date(e.date).getTime() < 30 * 864e5).map(e => e.date + e.einheit)).size;
  const firstDate  = all.reduce((m, e) => e.date < m ? e.date : m, all[0].date);
  const weeks      = Math.max((now - new Date(firstDate).getTime()) / (7 * 864e5), 1);
  const perWeek    = (sessions / weeks).toFixed(1).replace(".", ",");

  let html = `<div class="sbar" style="padding-top:24px">
    <div class="sc2"><div class="snum">${sessions}</div><div class="slbl">Einheiten</div></div>
    <div class="sc2"><div class="snum">${days30}</div><div class="slbl">Letzte 30 Tage</div></div>
    <div class="sc2"><div class="snum">${perWeek}</div><div class="slbl">Ø / Woche</div></div>
  </div>`;

  // ── Fortschritt pro Übung, gruppiert nach Einheit ──
  const colors = { Push: "var(--push)", Pull: "var(--pull)", Legs: "var(--legs)" };

  ["Push", "Pull", "Legs"].forEach(ein => {
    // Übungen in Plan-Reihenfolge, plus geloggte Übungen die nicht (mehr) im Plan sind
    const planNames   = PLAN[ein].map(x => x.name);
    const loggedNames = [...new Set(all.filter(e => e.einheit === ein).map(e => e.uebung))];
    const names       = [...planNames.filter(n => loggedNames.includes(n)),
                         ...loggedNames.filter(n => !planNames.includes(n))];
    if (!names.length) return;

    let cards = "";
    names.forEach(name => {
      const es = all.filter(e => e.uebung === name && parseKg(e.gewicht) !== null);
      if (!es.length) return;
      const vals  = es.map(e => parseKg(e.gewicht));
      const first = vals[0], last = vals[vals.length - 1], best = Math.max(...vals);
      const delta = last - first;
      const deltaStr = delta === 0 ? "±0" : (delta > 0 ? "+" : "−") + fmtKg(Math.abs(delta));
      const deltaCls = delta > 0 ? "up" : (delta < 0 ? "down" : "flat");
      const chart = vals.length >= 2
        ? sparkline(vals, colors[ein])
        : `<div class="spark-none">Erst 1 Datenpunkt – dranbleiben!</div>`;
      cards += `<div class="stcard">
        <div class="stc-top">
          <div class="stc-name">${name}</div>
          <span class="stc-delta ${deltaCls}">${deltaStr}</span>
        </div>
        ${chart}
        <div class="stc-meta">
          <span>Start ${fmtKg(first)}</span>
          <span>Aktuell <strong>${fmtKg(last)}</strong></span>
          <span>Best ${fmtKg(best)}</span>
          <span>${es.length}× geloggt</span>
        </div>
      </div>`;
    });

    if (cards) html += `<div class="peinheit">
      <div class="peh"><div class="pel ${ein}">${ein.toUpperCase()}</div><div class="pline"></div></div>
      ${cards}
    </div>`;
  });

  cont.innerHTML = html;
}

// ─── GEWICHT ─────────────────────────────────────────
// Zielkorridor Lean Bulk: 0,05–0,15 kg/Woche (~0,2–0,6 kg/Monat)
const W_MIN = 0.05, W_MAX = 0.15;
const W_TAU = 10;   // Glättungskonstante in Tagen
const W_WIN = 28;   // Regressionsfenster in Tagen
let wRange = 90;    // sichtbarer Zeitraum in Tagen (0 = alles)
let wPendingDel = null;

function loadWeights() {
  try { return JSON.parse(localStorage.getItem("tl-w") || "[]"); } catch { return []; }
}
function saveWeights(arr) { localStorage.setItem("tl-w", JSON.stringify(arr)); }

function saveWeight() {
  const date = document.getElementById("w-date").value;
  const kg   = parseFloat(String(document.getElementById("w-kg").value).replace(",", "."));
  if (!date || isNaN(kg)) { showFlash("Datum und Gewicht eintragen"); return; }
  const arr = loadWeights().filter(w => w.date !== date);
  arr.push({ id: Date.now(), date: date, kg: kg });
  arr.sort((a, b) => a.date < b.date ? -1 : 1);
  saveWeights(arr);
  document.getElementById("w-kg").value = "";
  buildWeight();
  showFlash("Gewicht gespeichert ✓");
}

function delWeight(id) {
  if (wPendingDel === id) {
    saveWeights(loadWeights().filter(w => w.id !== id));
    wPendingDel = null;
    buildWeight();
  } else {
    wPendingDel = id;
    buildWeight();
    setTimeout(() => { if (wPendingDel === id) { wPendingDel = null; buildWeight(); } }, 3000);
  }
}

function setWRange(d) { wRange = d; buildWeight(); }

function dayNum(d) { return Math.round(new Date(d + "T00:00:00").getTime() / 864e5); }

// Zeitgewichteter exponentieller Trend – gleicht ungleiche Wiege-Abstände aus
function computeTrend(arr) {
  const out = [];
  let t = null, prevDay = null;
  arr.forEach(w => {
    const d = dayNum(w.date);
    if (t === null) { t = w.kg; }
    else {
      const gap = Math.max(d - prevDay, 1);
      const alpha = 1 - Math.exp(-gap / W_TAU);
      t = t + alpha * (w.kg - t);
    }
    prevDay = d;
    out.push({ date: w.date, day: d, kg: w.kg, trend: t, id: w.id });
  });
  return out;
}

// Steigung der Trendlinie über die letzten W_WIN Tage (kg/Woche)
function weeklyRate(pts) {
  if (pts.length < 2) return null;
  const last = pts[pts.length - 1].day;
  const win  = pts.filter(p => last - p.day <= W_WIN);
  if (win.length < 3 || (win[win.length - 1].day - win[0].day) < 10) return null;
  const n = win.length;
  const mx = win.reduce((s, p) => s + p.day, 0) / n;
  const my = win.reduce((s, p) => s + p.trend, 0) / n;
  let num = 0, den = 0;
  win.forEach(p => { num += (p.day - mx) * (p.trend - my); den += (p.day - mx) ** 2; });
  if (den === 0) return null;
  return (num / den) * 7;
}

function fmtNum(n, dec) {
  return n.toFixed(dec).replace(".", ",");
}

function weightChart(pts) {
  const W = 320, H = 180, padL = 34, padR = 8, padT = 10, padB = 20;
  const days = pts.map(p => p.day);
  const vals = pts.flatMap(p => [p.kg, p.trend]);
  const dMin = Math.min(...days), dMax = Math.max(...days);
  const vMin = Math.min(...vals),  vMax = Math.max(...vals);
  const span = Math.max(vMax - vMin, 1.2);
  const lo = vMin - span * 0.15, hi = vMax + span * 0.15;
  const dRng = Math.max(dMax - dMin, 1);
  const X = d => padL + ((d - dMin) / dRng) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

  // Gridlines auf halbe Kilo gerundet
  const stepKg = (hi - lo) > 6 ? 2 : ((hi - lo) > 3 ? 1 : 0.5);
  let grid = "";
  for (let g = Math.ceil(lo / stepKg) * stepKg; g <= hi; g += stepKg) {
    grid += `<line x1="${padL}" y1="${Y(g).toFixed(1)}" x2="${W - padR}" y2="${Y(g).toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>
      <text x="${padL - 5}" y="${(Y(g) + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#BBBBBB" font-family="Figtree,sans-serif">${fmtNum(g, stepKg < 1 ? 1 : 0)}</text>`;
  }

  const raw   = pts.map(p => X(p.day).toFixed(1) + "," + Y(p.kg).toFixed(1)).join(" ");
  const trend = pts.map(p => X(p.day).toFixed(1) + "," + Y(p.trend).toFixed(1)).join(" ");
  const lastP = pts[pts.length - 1];

  const lblFirst = fmtDate(pts[0].date).slice(0, 6);
  const lblLast  = fmtDate(lastP.date).slice(0, 6);

  return `<svg class="wsvg" viewBox="0 0 ${W} ${H}">
    ${grid}
    <polyline points="${raw}" fill="none" stroke="#D8D8D8" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="${trend}" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(lastP.day).toFixed(1)}" cy="${Y(lastP.trend).toFixed(1)}" r="3.5" fill="#1A1A1A"/>
    <text x="${padL}" y="${H - 5}" font-size="9" fill="#BBBBBB" font-family="Figtree,sans-serif">${lblFirst}</text>
    <text x="${W - padR}" y="${H - 5}" text-anchor="end" font-size="9" fill="#BBBBBB" font-family="Figtree,sans-serif">${lblLast}</text>
  </svg>`;
}

function buildWeight() {
  const cont = document.getElementById("weight-cont");
  const all  = loadWeights().slice().sort((a, b) => a.date < b.date ? -1 : 1);

  if (!all.length) {
    cont.innerHTML = `<div class="empty"><div class="ei2">⚖️</div><div>Noch keine Messungen –<br>zweimal pro Woche nüchtern wiegen.</div></div>`;
    return;
  }

  const allPts = computeTrend(all);
  const lastDay = allPts[allPts.length - 1].day;
  const pts = wRange ? allPts.filter(p => lastDay - p.day <= wRange) : allPts;

  const cur  = allPts[allPts.length - 1];
  const rate = weeklyRate(allPts);

  // Δ 30 Tage auf Trendbasis
  const ref30 = allPts.filter(p => lastDay - p.day >= 28);
  const d30   = ref30.length ? cur.trend - ref30[ref30.length - 1].trend : null;

  let rateCls = "", verdictCls = "", verdict = "";
  if (rate === null) {
    verdictCls = "slow";
    verdict = `Noch zu wenig Daten für eine belastbare Rate. Ab etwa 3 Wochen bzw. 6 Messungen wird die Trendlinie tragfähig – bis dahin sagen einzelne Werte mehr über Wasserhaushalt und Darminhalt als über Muskelaufbau.`;
  } else if (rate < 0) {
    rateCls = "fast"; verdictCls = "fast";
    verdict = `<strong>Trend fällt.</strong> Bei laufendem Aufbau spricht das für ein Kaloriendefizit – Zufuhr über eine Woche gegenprüfen, bevor du nachjustierst.`;
  } else if (rate < W_MIN) {
    rateCls = "slow"; verdictCls = "slow";
    verdict = `<strong>Unter dem Korridor.</strong> Hält das über 2–3 Wochen an, Zufuhr um 100–150 kcal anheben – der Überschuss ist rechnerisch zu knapp für spürbaren Aufbau.`;
  } else if (rate <= W_MAX) {
    rateCls = "up"; verdictCls = "ok";
    verdict = `<strong>Im Zielkorridor.</strong> Rund ${fmtNum(rate * 4.35, 2)} kg/Monat – in dieser Größenordnung bleibt der Fettanteil am Zuwachs klein. Kurs halten.`;
  } else {
    rateCls = "fast"; verdictCls = "fast";
    verdict = `<strong>Über dem Korridor.</strong> Oberhalb von ${fmtNum(W_MAX, 2)} kg/Woche wandert ein wachsender Anteil in Fettmasse, weil die Muskelproteinsynthese die Obergrenze bildet – nicht die Kalorienzufuhr. Überschuss um 100–150 kcal senken.`;
  }

  const rateStr = rate === null ? "–" : (rate > 0 ? "+" : "−") + fmtNum(Math.abs(rate), 2);
  const d30Str  = d30 === null ? "–" : (d30 >= 0 ? "+" : "−") + fmtNum(Math.abs(d30), 1);

  let html = `<div class="wbar">
    <div class="wkpi"><div class="wkpi-num">${fmtNum(cur.trend, 1)}</div><div class="wkpi-lbl">Trend kg</div></div>
    <div class="wkpi"><div class="wkpi-num ${rateCls}">${rateStr}</div><div class="wkpi-lbl">kg / Woche</div></div>
    <div class="wkpi"><div class="wkpi-num">${d30Str}</div><div class="wkpi-lbl">Δ 30 Tage</div></div>
  </div>
  <div class="wverdict ${verdictCls}">${verdict}</div>`;

  if (pts.length >= 2) {
    html += `<div class="wchart">
      <div class="wchart-hd">
        <div class="wchart-t">VERLAUF</div>
        <div class="wlegend">
          <span><i class="wdot" style="background:#D8D8D8"></i>Messung</span>
          <span><i class="wdot" style="background:#1A1A1A"></i>Trend</span>
        </div>
      </div>
      ${weightChart(pts)}
    </div>`;
  }

  html += `<div class="wrange">
    ${[[30, "1M"], [90, "3M"], [0, "Alles"]].map(([d, l]) =>
      `<button class="wrbtn ${wRange === d ? "active" : ""}" onclick="setWRange(${d})">${l}</button>`).join("")}
  </div>`;

  const recent = allPts.slice(-14).reverse();
  html += `<div class="wlist">
    <div class="dl2">LETZTE MESSUNGEN</div>
    ${recent.map(p => `<div class="wrow">
      <div class="wrow-d">${fmtDate(p.date)}</div>
      <div class="wrow-kg">${fmtNum(p.kg, 1)} kg</div>
      <div class="wrow-tr">Trend ${fmtNum(p.trend, 1)}</div>
      <button class="dbtn ${wPendingDel === p.id ? "confirm" : ""}" onclick="delWeight(${p.id})">${wPendingDel === p.id ? "✓" : "×"}</button>
    </div>`).join("")}
  </div>`;

  html += `<div class="wnote">⚖️ Immer unter gleichen Bedingungen wiegen: morgens, nüchtern, nach dem Toilettengang, vor dem Trinken. Die Trendlinie glättet Tagesschwankungen über eine Zeitkonstante von ${W_TAU} Tagen – nur sie zählt, nicht der Einzelwert.<br><br>Zielkorridor Lean Bulk: <strong>${fmtNum(W_MIN, 2)}–${fmtNum(W_MAX, 2)} kg/Woche</strong>. Gewichtsdaten sind im CSV-Export im Log-Tab enthalten.</div>`;

  cont.innerHTML = html;
}

// ─── EXPORT ──────────────────────────────────────────
function exportCSV() {
  const rows = [
    ["Datum","Einheit","Übung","Gewicht","S1","S2","S3","S4","Notiz","↑ Erhöhen?"],
    ...loadEntries().map(e => [
      fmtDate(e.date), e.einheit, e.uebung, e.gewicht,
      e.s1, e.s2, e.s3, e.s4 || "", e.notiz || "",
      e.erhoehen ? "Ja" : "Nein"
    ])
  ].map(r => r.join(",")).join("\n");

  const wArr = loadWeights().slice().sort((a, b) => a.date < b.date ? -1 : 1);
  let out = rows;
  if (wArr.length) {
    const wp = computeTrend(wArr);
    out += "\n\n# GEWICHT\n" + [
      ["Datum", "Gewicht (kg)", "Trend (kg)"],
      ...wp.map(p => [fmtDate(p.date), fmtNum(p.kg, 1), fmtNum(p.trend, 2)])
    ].map(r => r.join(",")).join("\n");
  }
  const rowsOut = out;
  const a = document.createElement("a");
  a.href     = URL.createObjectURL(new Blob(["\uFEFF" + rowsOut], { type: "text/csv;charset=utf-8" }));
  a.download = "training-log-" + todayStr() + ".csv";
  a.click();
}

// ─── VIEWS ───────────────────────────────────────────
function showView(v) {
  ["add", "log", "stats", "weight", "plan"].forEach(id => {
    document.getElementById("view-" + id).classList.toggle("active", id === v);
    document.getElementById("nav-"  + id).classList.toggle("active", id === v);
  });
  if (v === "log")    renderLog();
  if (v === "stats")  buildStats();
  if (v === "weight") buildWeight();
}

// ─── UTILS ───────────────────────────────────────────
function todayStr() { return new Date().toISOString().split("T")[0]; }
function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
}
function showFlash(msg) {
  const el = document.getElementById("flash");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}
</script>
